<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDT · ARS y BOB · P2P</title>
<style>
:root{
  --bg:#f3f5f2; --panel:#fff; --ink:#15201a; --mute:#66736b; --line:#dfe5e0;
  --buy:#0f7a4d; --sell:#b4382c;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1512;--panel:#17201b;--ink:#e8efe9;--mute:#8a9a90;--line:#26332c;--buy:#3fd08c;--sell:#ff7a6b;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 12px 48px}
h1{font-size:1.15rem;margin:0 0 14px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pair h2{margin:0;padding:10px 14px;font-size:.95rem;font-weight:600;border-bottom:1px solid var(--line)}
.prices{display:grid;grid-template-columns:1fr 1fr}
.prices div{padding:12px 14px}
.prices div+div{border-left:1px solid var(--line)}
small{display:block;color:var(--mute);font-size:.78rem}
b{display:block;font-size:clamp(1.05rem,4.5vw,1.9rem);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy b{color:var(--buy)} .sell b{color:var(--sell)}
.status{margin-top:12px;color:var(--mute);font-size:.82rem}
.err{color:var(--sell)}
</style>
</head>
<body>
<main>
  <h1>Mejores precios de USDT en Binance P2P</h1>

  <div class="row" aria-live="polite">
    <div class="pair">
      <h2>USDT / ARS</h2>
      <div class="prices">
        <div class="buy"><small>Comprar</small><b id="ARS-BUY">—</b></div>
        <div class="sell"><small>Vender</small><b id="ARS-SELL">—</b></div>
      </div>
    </div>
    <div class="pair">
      <h2>USDT / BOB</h2>
      <div class="prices">
        <div class="buy"><small>Comprar</small><b id="BOB-BUY">—</b></div>
        <div class="sell"><small>Vender</small><b id="BOB-SELL">—</b></div>
      </div>
    </div>
  </div>

  <p class="status" id="status"></p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const API_BASE = window.location.hostname.endsWith("github.io") || window.location.protocol === "file:"
  ? "https://p2p-ars.onrender.com"
  : "";
const SYMBOL = { ARS: "$", BOB: "Bs " };
const PAIRS = [["ARS", "BUY"], ["ARS", "SELL"], ["BOB", "BUY"], ["BOB", "SELL"]];
let loading = false;

async function best(fiat, tradeType) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000); // Render gratis puede tardar en despertar
  try {
    const p = new URLSearchParams({ tradeType, rows: 1, fiat });
    const r = await fetch(API_BASE + "/api/ads?" + p, { signal: ctrl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Error " + r.status);
    return Array.isArray(j) && j.length ? j[0].price : null;
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "tiempo de espera agotado" : e.message);
  } finally {
    clearTimeout(timer);
  }
}

async function load() {
  if (loading) return; // evita consultas superpuestas
  loading = true;
  $("status").className = "status";
  $("status").textContent = "Actualizando…";
  const res = await Promise.allSettled(PAIRS.map(async ([fiat, t]) => {
    const v = await best(fiat, t);
    $(`${fiat}-${t}`).textContent = v ? SYMBOL[fiat] + fmt(v) : "—";
  })); // si una consulta falla, se conserva el último precio mostrado
  const fail = res.find((r) => r.status === "rejected");
  if (fail) {
    $("status").className = "status err";
    $("status").textContent = "No se pudo actualizar algún precio: " + fail.reason.message + ". Reintentando en 15 s.";
  } else {
    $("status").textContent = "Última actualización: " + new Date().toLocaleTimeString("es-AR") + " · se actualiza cada 15 s";
  }
  loading = false;
}

load();
setInterval(() => { if (!document.hidden) load(); }, 15000); // no consulta con la pestaña oculta
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
