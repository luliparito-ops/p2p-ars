<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDT/ARS · Cabecera P2P</title>
<style>
:root{
  --bg:#f3f5f2; --panel:#fff; --ink:#15201a; --mute:#66736b; --line:#dfe5e0;
  --buy:#0f7a4d; --sell:#b4382c; --accent:#15201a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1512;--panel:#17201b;--ink:#e8efe9;--mute:#8a9a90;--line:#26332c;--buy:#3fd08c;--sell:#ff7a6b;--accent:#e8efe9;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.25rem;margin:0 0 4px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:20px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input[type=checkbox]{padding:0;width:16px;height:16px}
.check{flex-direction:row;align-items:center;gap:8px;padding-bottom:9px}
button{cursor:pointer;background:var(--accent);color:var(--bg);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--buy);outline-offset:2px}
.head{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.head div{background:var(--panel);padding:14px 16px}
.head small{color:var(--mute);display:block}
.head b{font-size:1.9rem;font-variant-numeric:tabular-nums;font-weight:600}
.buy b{color:var(--buy)} .sell b{color:var(--sell)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}.head b{font-size:1.4rem}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
section h2{margin:0;padding:12px 14px;font-size:1rem;font-weight:600;border-bottom:1px solid var(--line)}
section.buy h2{border-left:4px solid var(--buy)} section.sell h2{border-left:4px solid var(--sell)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:.82rem}
th:first-child,td:first-child{text-align:left}
td.price{font-weight:600}
section.buy td.price{color:var(--buy)} section.sell td.price{color:var(--sell)}
tr:first-child td{background:color-mix(in srgb,var(--line) 40%,transparent)}
.pm{color:var(--mute);font-size:.8rem;white-space:normal;text-align:left;max-width:180px}
.msg{padding:16px;color:var(--mute)}
.status{margin-top:14px;color:var(--mute);font-size:.85rem}
.err{color:var(--sell)}
</style>
</head>
<body>
<main>
  <h1>USDT / ARS en Binance P2P</h1>
  <p class="sub">Primeras órdenes de cada lado del libro, ordenadas por mejor precio.</p>

  <div class="filters">
    <label>Monto en ARS (opcional)
      <input id="amount" inputmode="numeric" placeholder="ej. 500000">
    </label>
    <label>Medio de pago
      <select id="payType">
        <option value="">Todos</option>
        <option value="BANK">Transferencia bancaria</option>
        <option value="MercadoPagoNew">Mercado Pago</option>
        <option value="Brubank">Brubank</option>
        <option value="LemonCash">Lemon Cash</option>
        <option value="UalaBank">Ualá</option>
        <option value="PersonalPay">Personal Pay</option>
      </select>
    </label>
    <label>Cantidad de órdenes
      <select id="rows"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
    </label>
    <label class="check"><input type="checkbox" id="merchants"> Solo comerciantes verificados</label>
    <button id="go">Actualizar</button>
  </div>

  <div class="head" aria-live="polite">
    <div class="buy"><small>Mejor precio para comprar USDT</small><b id="bestBuy">—</b></div>
    <div class="sell"><small>Mejor precio para vender USDT</small><b id="bestSell">—</b></div>
    <div><small>Diferencia entre puntas</small><b id="spread">—</b></div>
  </div>

  <div class="cols">
    <section class="buy"><h2>Comprar USDT (anuncios de venta)</h2><div class="scroll" id="buy"><p class="msg">Cargando…</p></div></section>
    <section class="sell"><h2>Vender USDT (anuncios de compra)</h2><div class="scroll" id="sell"><p class="msg">Cargando…</p></div></section>
  </div>
  <p class="status" id="status"></p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n, d = 2) => n.toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });

function params(tradeType) {
  const p = new URLSearchParams({ tradeType, rows: $("rows").value });
  if ($("amount").value.trim()) p.set("amount", $("amount").value.replace(/\D/g, ""));
  if ($("payType").value) p.set("payType", $("payType").value);
  if ($("merchants").checked) p.set("merchants", "1");
  return p;
}

function render(el, ads) {
  if (!ads.length) { el.innerHTML = '<p class="msg">No hay órdenes con estos filtros. Probá con otro monto o medio de pago.</p>'; return; }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  el.innerHTML = `<table><thead><tr><th>Anunciante</th><th>Precio</th><th>Disponible</th><th>Límites (ARS)</th><th>Pago</th></tr></thead><tbody>` +
    ads.map((a) => `<tr>
      <td>${esc(a.nick)}${a.merchant ? " ✓" : ""}<br><span class="pm">${a.orders} órd. · ${fmt(a.rate * 100, 0)}%</span></td>
      <td class="price">${fmt(a.price)}</td>
      <td>${fmt(a.available)} USDT</td>
      <td>${fmt(a.min, 0)} – ${fmt(a.max, 0)}</td>
      <td class="pm">${esc(a.methods.join(", "))}</td></tr>`).join("") + "</tbody></table>";
}

async function load() {
  $("status").className = "status";
  $("status").textContent = "Actualizando…";
  try {
    const [buy, sell] = await Promise.all(["BUY", "SELL"].map(async (t) => {
      const r = await fetch("/api/ads?" + params(t));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Error al consultar");
      return j;
    }));
    render($("buy"), buy); render($("sell"), sell);
    const b = buy[0]?.price, s = sell[0]?.price;
    $("bestBuy").textContent = b ? "$" + fmt(b) : "—";
    $("bestSell").textContent = s ? "$" + fmt(s) : "—";
    $("spread").textContent = b && s ? `$${fmt(b - s)} (${fmt(((b - s) / s) * 100)}%)` : "—";
    $("status").textContent = "Última actualización: " + new Date().toLocaleTimeString("es-AR") + " · se actualiza cada 15 s";
  } catch (e) {
    $("status").className = "status err";
    $("status").textContent = "No se pudo consultar Binance: " + e.message + ". Reintentando en 15 s.";
  }
}

$("go").onclick = load;
["payType", "rows", "merchants"].forEach((id) => $(id).addEventListener("change", load));
$("amount").addEventListener("keydown", (e) => e.key === "Enter" && load());
load();
setInterval(load, 15000);
</script>
</body>
</html>
