<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDT · ARS y BOB · P2P</title>
<style>
:root{
  --bg:#eef1ee; --panel:#fff; --ink:#131c17; --mute:#6b786f; --line:#e0e6e1;
  --buy:#0f7a4d; --sell:#b4382c;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d1310;--panel:#161f1a;--ink:#e9f0ea;--mute:#8a9a90;--line:#26332c;--buy:#3fd08c;--sell:#ff7a6b;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
main{width:100%;padding:8px 8px 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.buy{--c:var(--buy)} .sell{--c:var(--sell)}
.buy,.sell{--t:color-mix(in srgb,var(--c) 5%,var(--panel));--edge:color-mix(in srgb,var(--c) 45%,var(--line))}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;
  box-shadow:0 1px 2px rgb(0 0 0/.05),0 10px 22px -16px rgb(0 0 0/.3)}
.pair h2{margin:0;padding:3px 10px 2px;line-height:1.1;font-size:.66rem;font-weight:600;color:var(--mute);letter-spacing:.1em}
.prices{display:grid;grid-template-columns:1fr 1fr;padding:1px;gap:1px}
.c{position:relative;font:inherit;color:inherit;margin:0;padding:11px 2px;border:0;border-radius:5px;text-align:center;min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:color-mix(in srgb,var(--c) 7%,transparent);transition:background .2s,box-shadow .2s}
.c:active{background:color-mix(in srgb,var(--c) 16%,transparent)}
.c[aria-expanded="true"]{background:color-mix(in srgb,var(--c) 16%,var(--panel));box-shadow:inset 0 0 0 1px var(--edge)}
.c b{display:block;color:var(--c);font-size:clamp(.9rem,3.9vw,2.6rem);font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.c b i{font-style:normal;font-size:.6em;font-weight:600;opacity:.7;margin-right:.15em}
:focus-visible{outline:2px solid var(--c,var(--buy));outline-offset:-2px}

.panel{--x:50%;position:relative;display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.3,.7,.2,1)}
.panel.open{grid-template-rows:1fr}
.panel .clip{min-height:0;overflow:hidden;padding:0 2px 14px;margin:0 -2px -14px}
.card{margin-top:10px;border:1px solid var(--edge);border-radius:6px;overflow:hidden;background:var(--t);
  box-shadow:0 1px 2px rgb(0 0 0/.05),0 12px 24px -14px color-mix(in srgb,var(--c) 75%,transparent);
  opacity:0;transform:scale(.94);transform-origin:var(--x) 0;transition:opacity .25s,transform .3s cubic-bezier(.3,.7,.2,1)}
.panel.open .card{opacity:1;transform:none}
.caret{position:absolute;top:4px;left:var(--x);width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);z-index:1;pointer-events:none;
  background:var(--t);border:solid var(--edge);border-width:1px 0 0 1px;opacity:0;transition:left .3s cubic-bezier(.3,.7,.2,1),opacity .2s}
.panel.open .caret{opacity:1}
.card h3{margin:0;padding:11px 12px 6px;display:flex;justify-content:space-between;font-size:.75rem;font-weight:650;letter-spacing:.06em;color:var(--c)}
.card h3 span{color:var(--mute);font-weight:500;letter-spacing:0}
.oh,.o{display:grid;grid-template-columns:1.15fr 1fr 1.25fr;gap:0 8px;padding:7px 12px;font-variant-numeric:tabular-nums}
.o{align-items:baseline}
.oh{color:var(--mute);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px;padding-bottom:4px}
.oh>:nth-child(2),.o>:nth-child(2){text-align:center}
.oh>:nth-child(3),.o>:nth-child(3){text-align:right}
ul{list-style:none;margin:0;padding:0}
.o{font-size:.85rem}
.o+.o{border-top:1px solid color-mix(in srgb,var(--c) 14%,var(--line))}
.o:first-child{background:color-mix(in srgb,var(--c) 10%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.o .pr{display:flex;align-items:flex-start;gap:3px;line-height:1}
.o .pr b{color:var(--c);font-weight:650;font-size:1.15rem;letter-spacing:-.01em}
.o>:nth-child(2),.o>:nth-child(3){font-size:.72rem;color:var(--ink)}
.o .pr small{font-size:.55rem;font-weight:500;color:var(--mute);margin-top:.12em}
.o .who,.o .meta,.o .pay,.o .note{grid-column:1/-1;font-size:.72rem;color:var(--mute)}
.o .who{display:flex;align-items:baseline;gap:8px;margin-top:3px}
.o .nk{font-size:.74rem;font-weight:650;color:var(--mute)}
.o .tr{font-size:.6rem;color:var(--mute);white-space:nowrap}
.o .pay{font-size:.68rem;line-height:1.45}
.o .meta{display:flex;flex-wrap:wrap;gap:2px 12px}
.o .meta strong{color:var(--ink);font-weight:600}
.o .note{font-style:italic;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.msg{margin:0;padding:10px 12px 14px;color:var(--mute);font-size:.85rem}
.status{margin:10px 0 0;color:var(--mute);font-size:.72rem;text-align:center}
.err{color:var(--sell)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.row.single{grid-template-columns:1fr;margin-bottom:8px}
.row.single .prices{grid-template-columns:1fr}

/* calculadora */
.calc{padding:4px 10px 10px}
.cg{display:grid;grid-template-columns:1fr 1.2fr .85fr;gap:8px}
.cg label{display:block;font-size:.7rem;color:var(--mute);margin:0 0 2px}
.cg input{width:100%;min-width:0;font:inherit;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:5px;padding:7px 8px;text-align:right}
.cg input:focus{outline:2px solid var(--buy);outline-offset:-1px}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 0;font-size:.68rem;color:var(--mute)}
.hint button{font:inherit;font-size:.7rem;color:var(--buy);background:none;border:0;padding:2px 0;cursor:pointer;white-space:nowrap}
.hint button[hidden]{display:none}
.res{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.res div{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;font-size:.85rem}
.res span{color:var(--mute)}
.res .g{padding-top:6px}
.res .g span{color:var(--ink);font-weight:600}
.res .g b{font-size:1.2rem;font-weight:650;color:var(--buy)}
.res .g b small{font-size:.65em;font-weight:600;margin-left:.3em}
.cp{justify-self:end;width:34px;height:30px;display:grid;place-items:center;margin:0 0 2px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:5px;cursor:pointer}
.cp:disabled{opacity:.45;cursor:default}
.cp.ok{color:var(--buy);border-color:var(--buy)}
.ul{font:inherit;font-size:.7rem;color:var(--buy);background:none;border:0;padding:0;margin:0 0 2px;text-align:left;align-self:end;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1 class="sr">Mejores precios de USDT en Binance P2P. Tocá un precio para ver sus órdenes.</h1>

  <div class="row single" aria-live="polite">
    <div class="pair">
      <h2>ARS/BOB · IMPLÍCITO</h2>
      <div class="prices">
        <div class="c buy" role="group" aria-label="Cotización implícita: venta de USDT en BOB dividida por compra de USDT en ARS"><b id="p-ARSBOB-BUY">—</b></div>
      </div>
    </div>
  </div>

  <div class="row single">
    <div class="pair" id="calc">
      <h2>CALCULADORA · ARS → BOB</h2>
      <div class="calc">
        <div class="cg">
          <span></span><span></span>
          <button type="button" class="cp" id="c-copy" aria-label="Copiar mensaje para el cliente" title="Copiar mensaje" disabled></button>
          <button type="button" class="ul" id="c-unit" aria-label="Cambiar la moneda del monto"><span id="c-unit-t">Monto BOB</span> ⇄</button>
          <label for="c-rate">Cotización cliente</label>
          <label for="c-pct">Ganancia (%)</label>
          <input id="c-amt" inputmode="decimal" autocomplete="off" value="12.000" aria-label="Monto">
          <input id="c-rate" inputmode="decimal" autocomplete="off" placeholder="—">
          <input id="c-pct" inputmode="decimal" autocomplete="off" placeholder="—">
        </div>
        <p class="hint"><span id="c-hint"></span><button type="button" id="c-reset" hidden>↺ Restablecer</button></p>
        <div class="res" aria-live="polite">
          <div><span>Cliente recibe</span><b id="r-get">—</b></div>
          <div><span>Cliente paga</span><b id="r-cli">—</b></div>
          <div><span>Yo pago</span><b id="r-me">—</b></div>
          <div class="g"><span>Ganancia</span><b id="r-gan">—</b></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row" aria-live="polite">
    <div class="pair">
      <h2>USDT/ARS</h2>
      <div class="prices">
        <button class="c buy" data-key="ARS-BUY" aria-expanded="false" aria-controls="panel" aria-label="USDT/ARS comprar, ver órdenes"><b id="p-ARS-BUY">—</b></button>
        <button class="c sell" data-key="ARS-SELL" aria-expanded="false" aria-controls="panel" aria-label="USDT/ARS vender, ver órdenes"><b id="p-ARS-SELL">—</b></button>
      </div>
    </div>
    <div class="pair">
      <h2>USDT/BOB</h2>
      <div class="prices">
        <button class="c buy" data-key="BOB-BUY" aria-expanded="false" aria-controls="panel" aria-label="USDT/BOB comprar, ver órdenes"><b id="p-BOB-BUY">—</b></button>
        <button class="c sell" data-key="BOB-SELL" aria-expanded="false" aria-controls="panel" aria-label="USDT/BOB vender, ver órdenes"><b id="p-BOB-SELL">—</b></button>
      </div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="caret"></div>
    <div class="clip"><div class="card" id="card"><h3><b id="dt"></b><span>mejores órdenes</span></h3><div id="dl"></div></div></div>
  </div>

  <p class="status" id="status"></p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n, d = 2) => n.toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const API_BASE = window.location.hostname.endsWith("github.io") || window.location.protocol === "file:"
  ? "https://p2p-ars.onrender.com"
  : "";
const SYMBOL = { ARS: "$", BOB: "Bs" };
const PAIRS = [["ARS", "BUY"], ["ARS", "SELL"], ["BOB", "BUY"], ["BOB", "SELL"]];
const ROWS = 10;
const state = {};
let selected = null, loading = false, again = false;
const cells = [...document.querySelectorAll(".c[data-key]")];

async function getAds(fiat, tradeType, rows) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000); // Render gratis puede tardar en despertar
  try {
    const p = new URLSearchParams({ tradeType, rows, fiat });
    const r = await fetch(API_BASE + "/api/ads?" + p, { signal: ctrl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Error " + r.status);
    return Array.isArray(j) ? j : [];
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "tiempo de espera agotado" : e.message);
  } finally {
    clearTimeout(timer);
  }
}

function list(ads) {
  if (!ads.length) return '<p class="msg">Sin órdenes disponibles.</p>';
  const ok = Number.isFinite;
  return '<div class="oh"><span>Precio</span><span>Disponible</span><span>Límites</span></div><ul>' + ads.map((a) => {
    const meta = [
      ok(a.minQty) && ok(a.maxQty) && ["Límites USDT", fmt(a.minQty) + " – " + fmt(a.maxQty)],
    ].filter(Boolean).map(([k, v]) => `<span>${k} <strong>${esc(v)}</strong></span>`).join("");
    const tr = [
      ok(a.orders) && fmt(a.orders, 0) + (ok(a.rate) ? " (" + fmt(a.rate * 100, 2) + "%)" : ""),
      ok(a.positive) && fmt(a.positive * 100, 2) + "%",
    ].filter(Boolean).join(" · ");
    const reqs = [a.kyc === 1 && "KYC obligatorio", a.regDays > 0 && a.regDays + "+ días de registro"].filter(Boolean);
    return `<li class="o"><div class="pr"><b>${fmt(a.price)}</b>${ok(a.payTime) ? `<small>${a.payTime} min</small>` : ""}</div><span>${fmt(a.available)} USDT</span><span>${fmt(a.min, 0)} – ${fmt(a.max, 0)}</span>` +
      `<div class="who"><span class="nk">${esc(a.nick)}${a.merchant ? " ✓" : ""}</span>${tr ? `<span class="tr">${tr}</span>` : ""}</div>` +
      (meta ? `<div class="meta">${meta}</div>` : "") +
      (reqs.length ? `<div class="pay">Requisitos: ${esc(reqs.join(" · "))}</div>` : "") +
      (a.remarks ? `<div class="note">${esc(a.remarks)}</div>` : "") + "</li>";
  }).join("") + "</ul>";
}

function place() { // origen de la animación y bordes según el precio tocado
  const btn = cells.find((c) => c.dataset.key === selected);
  if (!btn) return;
  const a = btn.getBoundingClientRect(), b = $("panel").getBoundingClientRect();
  $("panel").style.setProperty("--x", a.left + a.width / 2 - b.left + "px");
}

function showDetail() {
  cells.forEach((c) => c.setAttribute("aria-expanded", c.dataset.key === selected));
  $("panel").classList.toggle("open", !!selected);
  if (!selected) return;
  const [fiat, t] = selected.split("-");
  $("panel").className = "panel open " + (t === "BUY" ? "buy" : "sell");
  place();
  $("dt").textContent = "USDT/" + fiat;
  $("dl").innerHTML = state[selected] ? list(state[selected]) : '<p class="msg">Cargando…</p>';
}

function paint(key) {
  const ads = state[key];
  if (!ads) return;
  const v = ads[0]?.price;
  $("p-" + key).innerHTML = v ? `<i>${SYMBOL[key.slice(0, 3)]}</i>${fmt(v)}` : "—";
  if (key === selected) showDetail();
}

async function load(force) {
  if (loading) { if (force) again = true; return; } // evita consultas superpuestas
  loading = true;
  $("status").className = "status";
  $("status").textContent = "Actualizando…";
  const res = await Promise.allSettled(PAIRS.map(async ([fiat, t]) => {
    const key = fiat + "-" + t;
    state[key] = await getAds(fiat, t, key === selected ? ROWS : 1); // solo trae más órdenes del precio abierto
    paint(key);
  })); // si una consulta falla, se conserva lo último mostrado
  const fail = res.find((r) => r.status === "rejected");
  if (fail) {
    $("status").className = "status err";
    $("status").textContent = "No se pudo actualizar algún dato: " + fail.reason.message + ". Reintentando en 15 s.";
  } else {
    $("status").textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR") + " · cada 15 s";
  }
  loading = false;
  if (again) { again = false; load(); }
}

cells.forEach((btn) => {
  btn.onclick = () => {
    selected = selected === btn.dataset.key ? null : btn.dataset.key; // mismo precio = esconder
    showDetail();
    if (selected) load(true);
  };
});
window.addEventListener("resize", place);

load();
setInterval(() => { if (!document.hidden) load(); }, 15000); // no consulta con la pestaña oculta
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
<script>
(function () { // cotización implícita + selección manual de órdenes + calculadora
  const fmt6 = (n) => n.toLocaleString("es-AR", { minimumFractionDigits: 6, maximumFractionDigits: 6 });
  const override = {}; // precio manual elegido por celda: "ARS-BUY" -> precio
  let suppress = false;
  let imp = null; // cotización implícita vigente (Bs por ARS)

  const eff = (key) => override[key] || (state[key] && state[key][0] && state[key][0].price) || null;

  function renderCell(key) { // pinta la celda con el precio vigente (manual o mejor), con ● si es manual
    const v = eff(key);
    $("p-" + key).innerHTML = v
      ? `<i>${SYMBOL[key.slice(0, 3)]}</i>${fmt(v)}${override[key] ? '<span style="font-size:.45em;opacity:.85"> ●</span>' : ""}`
      : "—";
  }

  function update() { // implícita = venta de USDT en BOB ÷ compra de USDT en ARS (Bs por cada ARS)
    const bobSell = eff("BOB-SELL"), arsBuy = eff("ARS-BUY");
    imp = bobSell && arsBuy ? bobSell / arsBuy : null;
    $("p-ARSBOB-BUY").innerHTML = imp ? `<i>Bs</i>${fmt6(imp)}` : "—";
    calc();
  }

  const _paint = paint; // respeta la selección manual y recalcula la implícita tras cada actualización
  paint = function (key) {
    _paint(key);
    if (override[key]) renderCell(key);
    update();
  };

  // tap sobre una orden del listado: la elige como precio (mismo tap = volver al mejor precio)
  $("dl").addEventListener("click", (e) => {
    const li = e.target.closest("li.o");
    if (!li || !selected) return;
    const ad = state[selected] && state[selected][[...li.parentNode.children].indexOf(li)];
    if (!ad) return;
    if (override[selected] === ad.price) delete override[selected];
    else override[selected] = ad.price;
    renderCell(selected);
    update();
  });

  // pulsación larga (500 ms) sobre un precio: vuelve al mejor precio
  cells.forEach((btn) => {
    let t;
    btn.addEventListener("pointerdown", () => {
      suppress = false;
      t = setTimeout(() => {
        suppress = true;
        if (override[btn.dataset.key]) {
          delete override[btn.dataset.key];
          paint(btn.dataset.key);
        }
      }, 500);
    });
    btn.addEventListener("pointerup", () => clearTimeout(t));
    ["pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, () => { clearTimeout(t); suppress = false; }));
  });
  document.addEventListener("click", (e) => { // evita que la pulsación larga también abra o cierre el listado
    if (suppress) { e.stopPropagation(); e.preventDefault(); suppress = false; }
  }, true);

  /* ---- calculadora ----
     El cliente siempre paga ARS y recibe BOB. El monto puede ser en BOB o en ARS (botón ⇄).
     modo "offset": cotización cliente = implícita − 0,0002 (por defecto, sigue a la implícita)
     modo "pct":    cotización cliente = implícita ÷ (1 + %) (el % elegido se mantiene)
     modo "rate":   cotización cliente fija; el % se recalcula
     La cotización se redondea a 5 decimales: lo que ves es lo que se calcula y lo que se copia. */
  const OFFSET = 0.0002;
  let mode = "offset", unit = "BOB", pctV = NaN, rateV = NaN;
  const elM = $("c-amt"), elR = $("c-rate"), elP = $("c-pct"), btnC = $("c-copy");
  const ICON_COPY = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
  const ICON_OK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  btnC.innerHTML = ICON_COPY;

  const r5 = (x) => Math.round(x * 1e5) / 1e5;
  const ars = (n) => SYMBOL.ARS + " " + fmt(n, 0);
  const bs = (n) => SYMBOL.BOB + " " + fmt(n, 0);

  function num(s) { // acepta "12.000", "12000", "0,00722" y "0.00722"
    s = String(s).trim();
    if (!s) return NaN;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    return Number(s);
  }

  function model() {
    const m = num(elM.value);
    let rate = NaN, pct = NaN;
    if (mode === "rate") rate = r5(rateV);
    else if (imp) rate = r5(mode === "pct" ? imp / (1 + pctV / 100) : imp - OFFSET);
    if (!(rate > 0)) rate = NaN;
    if (imp && rate) pct = (imp / rate - 1) * 100;
    let bob = null, cli = null;
    if (m > 0 && rate) {
      if (unit === "BOB") { bob = m; cli = Math.round(m / rate); }   // pide bolivianos: calcula pesos
      else { cli = m; bob = Math.floor(m * rate); }                  // ofrece pesos: bolivianos enteros hacia abajo
    }
    const me = bob && imp ? bob / imp : null;                        // pesos que me cuesta conseguir esos bolivianos
    const gan = cli && me ? cli - me : null;
    return { m, rate, pct, bob, cli, me, gan };
  }

  function calc() {
    const o = model();
    if (mode !== "rate" && document.activeElement !== elR) elR.value = o.rate ? fmt(o.rate, 5) : "";
    if (mode !== "pct" && document.activeElement !== elP) elP.value = Number.isFinite(o.pct) ? fmt(o.pct, 2) : "";
    $("c-unit-t").textContent = "Monto " + unit;
    $("r-get").textContent = o.bob ? bs(o.bob) : "—";
    $("r-cli").textContent = o.cli ? ars(o.cli) : "—";
    $("r-me").textContent = o.me ? ars(o.me) : "—";
    const g = $("r-gan");
    if (o.gan !== null) {
      g.style.color = o.gan >= 0 ? "var(--buy)" : "var(--sell)";
      g.innerHTML = (o.gan >= 0 ? "+ " : "− ") + ars(Math.abs(o.gan)) + "<small>" + fmt(o.pct, 2) + " %</small>";
    } else { g.textContent = "—"; g.style.color = ""; }
    btnC.disabled = !(o.bob && o.cli);
    $("c-hint").textContent = !imp ? "Esperando la cotización implícita…"
      : mode === "offset" ? "Cotización = implícita − 0,0002, se actualiza sola"
      : mode === "pct" ? "Cotización calculada para ganar ese %, sigue a la implícita"
      : "Cotización fija, el % se recalcula";
    $("c-reset").hidden = mode === "offset";
  }

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      ta.remove();
      return ok;
    }
  }

  let copyTimer;
  btnC.addEventListener("click", async () => {
    const o = model();
    if (!(o.bob && o.cli)) return;
    const msg = unit === "BOB"
      ? `${fmt(o.bob, 0)} bolivianos serían ${fmt(o.cli, 0)} pesos, a una cotización de ${fmt(o.rate, 5)}.`
      : `${fmt(o.cli, 0)} pesos serían ${fmt(o.bob, 0)} bolivianos, a una cotización de ${fmt(o.rate, 5)}.`;
    const ok = await copyText(msg);
    clearTimeout(copyTimer);
    if (ok) {
      btnC.innerHTML = ICON_OK; btnC.classList.add("ok"); btnC.title = "Copiado";
      copyTimer = setTimeout(() => { btnC.innerHTML = ICON_COPY; btnC.classList.remove("ok"); btnC.title = "Copiar mensaje"; }, 1600);
    } else {
      $("c-hint").textContent = "No se pudo copiar el mensaje";
    }
  });

  $("c-unit").addEventListener("click", () => { // alterna BOB ⇄ ARS y conserva la misma operación
    const o = model();
    if (o.m > 0 && o.rate) elM.value = fmt(unit === "BOB" ? o.cli : o.bob, 0);
    unit = unit === "BOB" ? "ARS" : "BOB";
    calc();
  });
  elM.addEventListener("input", calc);
  elR.addEventListener("input", () => { mode = "rate"; rateV = num(elR.value); calc(); });
  elP.addEventListener("input", () => { mode = "pct"; pctV = num(elP.value); calc(); });
  $("c-reset").addEventListener("click", () => { mode = "offset"; if (document.activeElement) document.activeElement.blur(); calc(); });

  update();
})();
</script>
</body>
</html>
